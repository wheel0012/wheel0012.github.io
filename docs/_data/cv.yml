research_experience:
  - title: GPU Scheduling and Memory-System Analysis
    date: Spring 2026
    type: Undergraduate Research Project (URP) · Vortex GPGPU Simulator
    slides_url: /assets/slides/2026spring_URP_GPU_sched.pdf
    bullets:
      - Evaluated RR, GTO, gCAWS, and CCWS-inspired warp-scheduling and arbitration policies.
      - Characterized IPC, cache locality, and memory stalls across Rodinia workloads with different memory-access patterns.
      - Investigated cache- and memory-aware scheduling policies for workload-dependent bottlenecks.
  - title: 77 GHz mmWave Radar and Vision-based Gesture Recognition
    date: Spring 2026
    type: Capstone Design Project
    bullets:
      - Developed a multimodal gesture-recognition pipeline using 77 GHz mmWave radar and vision data.
      - Processed radar sequences and trained frame-stacked CNN, CNN–LSTM, BiLSTM, and TCN models for vision-limited environments.
  - title: Multithreading Models in SimpleScalar
    date: Summer 2025
    type: Project
    bullets:
      - Implemented FGMT, CGMT, and SMT in sim-outorder.c.
      - Evaluated and compared the performance of the three multithreading models using SimpleScalar.
  - title: Exploring Reconfigurable CPU Architecture and Heterogeneous Integrated Circuits
    date: Winter 2024
    type: Project
    bullets:
      - Explored reconfigurable CPU architectures and heterogeneous integrated-circuit technologies.

