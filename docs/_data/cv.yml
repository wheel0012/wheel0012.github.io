research_experience:
  - title: Warp Scheduling and Memory-System Analysis in Vortex GPGPU
    date: Spring 2026
    type: Undergraduate Research Project (URP) · Fermi-like Configuration
    slides_url: /assets/slides/2026spring_URP_GPU_sched.pdf
    bullets:
      - Implemented and evaluated RR, GTO, gCAWS, and CCWS-inspired warp-scheduling and arbitration policies in the Vortex GPGPU simulator.
      - Characterized IPC, cache locality, and memory stalls across Rodinia workloads with diverse memory-access patterns.
      - Analyzed workload-dependent trade-offs between memory-aware and conventional scheduling policies.
  - title: Simultaneous Multithreading in SimpleScalar
    date: Summer 2025
    type: Undergraduate Research Project (URP)
    bullets:
      - Implemented SMT support in sim-outorder.c.
      - Evaluated the performance impact of simultaneous multithreading under selected workloads.
  - title: Reconfigurable CPU Architecture and Heterogeneous Integration
    date: Winter 2024
    type: Undergraduate Research Project (URP)
    bullets:
      - Surveyed reconfigurable CPU architectures and heterogeneous integration technologies.
  - title: 77 GHz mmWave Radar and Vision-based Gesture Recognition
    date: Spring 2026
    type: Capstone Design Project
    bullets:
      - Developed a multimodal 77 GHz mmWave radar and vision gesture-recognition pipeline and evaluated CNN, RNN, and TCN models under vision-limited conditions.

